<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <title>Human Anatomy</title>
  </head>
  <body>
    <button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
      <svg class="fullscreen-expand" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" />
      </svg>
      <svg class="fullscreen-collapse" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3" />
      </svg>
    </button>

    <main id="scene" aria-label="Interactive 3D anatomy viewer"></main>

    <aside class="organ-selector" aria-labelledby="organ-selector-title">
      <h2 id="organ-selector-title">Organs</h2>
      <div id="organ-list" class="organ-list" role="group" aria-label="Display one organ at a time"></div>
      <p id="organ-status" class="organ-status" role="status" hidden></p>
    </aside>

    <aside id="part-info" class="part-info" aria-live="polite" aria-hidden="true" hidden>
      <h2 id="part-name"></h2>
      <p id="part-description"></p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
